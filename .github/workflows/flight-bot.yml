name: Flight Price Watcher

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes (UTC)
  workflow_dispatch: {}       # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated state file

jobs:
  check-flights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight bot
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python flight_bot.py

      - name: Commit updated state file
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add flight_state.json
          git diff --quiet --cached || git commit -m "Update flight price state [skip ci]"
          git push
      - name: Debug token length (temporary)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: echo "Token length is ${#TG_BOT_TOKEN}"