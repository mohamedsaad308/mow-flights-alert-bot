name: Flight Price Watcher

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}
  push:
    branches: [master]   # or master, or omit "branches" to run on all pushes

permissions:
  contents: write   # needed so the workflow can commit the updated state file

jobs:
  check-flights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run flight bot
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python flight_bot.py

      - name: Commit updated state file
        run: |
          git config user.name "flight-bot"
          git config user.email "flight-bot@users.noreply.github.com"
          git add flight_state.json
          git diff --quiet --cached || git commit -m "Update flight price state [skip ci]"
          git push
      - name: Debug token validity (temporary)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="✅ Flight bot workflow test message"